name: build

# PyInstaller cannot cross-compile: a runner builds only artifacts for its own
# OS and CPU. That is why the matrix below names five native runners -- there is
# no shortcut, and every artifact is produced on the platform it runs on.
#
# Triggers: a v* tag push or a manual run (Actions -> build -> Run workflow)
# builds and uploads all five bundles. Pull requests run the test job only.
#
# setup-uv publishes only exact tags (there is no floating vNN alias from v8 on),
# so the action is pinned to a release here and bumped deliberately.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  # Fast PR feedback, and the same gate the bundles have to pass.
  test:
    name: tests (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      - name: install
        run: uv sync
      - name: pytest
        run: uv run pytest

      # Lint the workflow files themselves. This exists because a single
      # disallowed context in an `if:` (secrets is not available there) made
      # GitHub reject the whole file: every run died in 0s having created zero
      # jobs, and nothing in the repo said why. `actionlint` names the line.
      # Pinned to the version this repo was validated against.
      - name: lint workflows
        run: |
          curl -sSLo actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          tar xzf actionlint.tar.gz actionlint
          ./actionlint -color

  bundle:
    name: bundle (${{ matrix.name }})
    needs: test
    # PRs are served by the test job; bundles are for tags and manual runs.
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    # The `secrets` context is NOT available in a step-level `if`. Passing the
    # token through a job-level env var is the supported indirection: `env` IS
    # allowed in `if`, and an unset secret arrives here as the empty string.
    # (Getting this wrong does not fail one step: GitHub rejects the whole
    # workflow file, so every run dies in 0s with zero jobs.)
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest        # arm64
            name: macos-arm64
          - os: macos-15-intel      # x86_64
            name: macos-x86_64
          - os: ubuntu-22.04        # x86_64
            name: linux-x86_64
          - os: ubuntu-24.04-arm    # arm64
            name: linux-arm64
          - os: windows-latest      # x86_64
            name: windows-x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"

      # The desktop app is the `app` extra. It brings pywebview plus its
      # platform pieces: pythonnet on Windows, the pyobjc frameworks on macOS,
      # and PyQt6 + Qt WebEngine through pywebview[qt] on Linux (the platform
      # marker lives in pyproject.toml).
      - name: install
        run: uv sync --extra app --python "${{ env.PYTHON_VERSION }}"

      # PyInstaller is a build tool, not a runtime dependency, so it is
      # installed into the synced environment instead of declared in
      # pyproject.toml. The `--no-sync` on the runs below keeps `uv run` from
      # pruning it again.
      - name: install pyinstaller
        run: uv pip install "pyinstaller>=6.22,<7"

      # A bundle is only ever built from a green tree.
      - name: pytest
        run: uv run --no-sync pytest

      - name: build
        run: >-
          uv run --no-sync pyinstaller packaging/jobscout.spec
          --noconfirm --distpath dist --workpath build

      # Package by hand: an artifact-service zip does not preserve the symlinks
      # inside a macOS .app, and macOS then reports the app as "damaged". ditto
      # keeps the bundle intact. (It also preserves the extended attributes the
      # first-run bypass depends on -- a plain archiver strips them, which is
      # the failure the xattr -cr note in docs/INSTALL.md covers.)
      - name: package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/jobscout.app "dist/jobscout-${{ matrix.name }}.zip"
      - name: package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "dist/jobscout-${{ matrix.name }}.tar.gz" -C dist jobscout
      - name: package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/jobscout -DestinationPath "dist/jobscout-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v7
        id: upload-unsigned
        with:
          name: jobscout-${{ matrix.name }}
          path: |
            dist/jobscout-${{ matrix.name }}.zip
            dist/jobscout-${{ matrix.name }}.tar.gz
          if-no-files-found: error

      # --- signing (Windows only) -------------------------------------------
      # There is no free code-signing route on macOS: it needs a paid Apple
      # Developer account. On Windows there IS one -- the SignPath Foundation
      # signs OSS at no cost, which is what removes the SmartScreen warning
      # instead of asking every user to click through it.
      #
      # Gated on the secrets existing, so it is a no-op until the SignPath
      # application is approved and the secrets are set.
      #
      # NOT YET WIRED, and deliberately left that way rather than guessed at:
      # this submits the unsigned artifact and writes the signed one to
      # dist/signed, but the round-trip is not finished. Completing it needs
      # (a) the signed .exe copied back over the packaged tree, (b) the zip
      # rebuilt, and (c) the signed zip re-uploaded -- naming the artifact
      # differently so users cannot pick the unsigned one by mistake. Those
      # three steps depend on SignPath's own artifact configuration, which does
      # not exist until the project is created, so they are left for the pass
      # that has a real project to test against.
      - name: sign (Windows / SignPath Foundation)
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signed
        continue-on-error: true   # never fail a release because signing broke

  # Tags get a GitHub release with every artifact attached, so a user lands on
  # one page and picks their platform. Unsigned on purpose -- see
  # docs/INSTALL.md for what each platform shows on first run.
  release:
    name: release
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The changelog is built from the commits and the tags. A shallow
          # clone has neither, so `git describe` would fail and the notes would
          # silently come out as a single unreleased blob.
          fetch-depth: 0
      - uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true
      - name: list what will be published
        run: find artifacts -type f | sort
      - name: build the release notes
        id: notes
        run: |
          {
            python3 packaging/changelog.py "${GITHUB_REF_NAME}"
            echo "---"
            echo
            cat packaging/release-footer.md
          } > RELEASE_NOTES.md
          # action-gh-release would otherwise title it with the bare tag
          echo "title=jobscout ${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "----- notes as they will be published -----"
          cat RELEASE_NOTES.md
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.notes.outputs.title }}
          files: artifacts/*
          # Published straight away. The tag is the human decision; a second
          # click on a draft only adds a way to ship nothing by forgetting.
          draft: false
          body_path: RELEASE_NOTES.md
