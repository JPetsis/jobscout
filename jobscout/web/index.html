<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jobscout</title>
<link rel="stylesheet" href="styles.css">
<script>
/* Decide the palette before the first paint. The OS preference is available
   synchronously; the stored choice arrives from the bridge a moment later and
   corrects this if the user picked the opposite. Without it a dark-mode user
   on a light OS gets a white flash before their saved choice lands. */
document.documentElement.dataset.theme =
  window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
</script>
</head>
<body>

<!-- Who is using jobscout? Shown once per run, and only when there is more
     than one profile to choose between. Also reachable from Settings. -->
<div id="picker" class="overlay solid" role="dialog" aria-modal="true"
     aria-labelledby="picker-title" hidden>
  <div class="overlay-card picker-card">
    <h2 id="picker-title">Who's using jobscout?</h2>
    <p class="muted">Each profile keeps its own settings, job boards and saved
      postings — nothing is shared between them.</p>
    <div id="picker-list" class="picker-list"></div>
    <form id="picker-new" class="picker-new" autocomplete="off">
      <input id="picker-name" type="text" maxlength="40" autocomplete="off"
             placeholder="Name for a new profile"
             aria-label="Name for a new profile">
      <button id="picker-create" class="ghost" type="submit">Create</button>
    </form>
    <p class="picker-err" id="picker-err" hidden></p>
    <button id="picker-cancel" class="linkish" type="button" hidden>Cancel</button>
  </div>
</div>

<header class="bar">
  <div class="brand">
    <span class="dot"></span>
    <h1>jobscout</h1>
  </div>
  <div class="stats" id="stats"><span class="muted">loading…</span></div>
  <div class="bar-actions">
    <div class="seg theme" id="theme" role="group" aria-label="Colour scheme">
      <button data-v="system" title="Follow the system setting" aria-label="Follow the system setting">◐</button>
      <button data-v="light" title="Light" aria-label="Light">☀</button>
      <button data-v="dark" title="Dark" aria-label="Dark">☾</button>
    </div>
    <button id="scan-btn" class="ghost" title="Fetch new openings from the enabled sources">Scan</button>
    <button id="settings-btn" class="ghost" title="Edit your profile: titles, skills, locations, strictness">Settings</button>
  </div>
</header>

<!-- scan progress: replaces the stats line while a scan runs -->
<div id="scan-bar" class="scanbar" hidden role="status" aria-live="polite">
  <span class="scan-label" id="scan-label">starting…</span>
  <div class="track"><div class="fill" id="scan-fill"></div></div>
  <button id="scan-cancel" class="ghost small">Cancel</button>
</div>

<div id="update-bar" class="updatebar" hidden role="status" aria-live="polite">
  <span class="up-text" id="update-text"></span>
  <button id="update-install" class="ghost small">Install and restart</button>
  <button id="update-dismiss" class="ghost small" aria-label="Dismiss this notice">✕</button>
</div>

<section class="filters">
  <input type="search" id="q" placeholder="Search title, company, city…" autocomplete="off">
  <label class="fresh" id="qtext-label"
         title="Search inside the advert text as well: every word must appear,
partial words count from their start, so &quot;ausgrab&quot; finds
&quot;Ausgrabung&quot;. This runs in the database, so it looks at every posting
stored, not just the ones on screen.">
    <input type="checkbox" id="qtext"> <span>in the advert text</span>
  </label>
  <div class="seg" id="band" role="group" aria-label="Score band">
    <button data-v="all" class="on">All</button>
    <button data-v="strong">Strong</button>
    <button data-v="match">Matches</button>
  </div>
  <select id="source" aria-label="Source"><option value="all">All sources</option></select>
  <select id="status" aria-label="Status">
    <option value="new">New</option>
    <option value="saved">Saved</option>
    <option value="applied">Applied</option>
    <option value="dismissed">Dismissed</option>
    <option value="all">Any status</option>
  </select>
  <label class="fresh" id="fresh-label"
         title="Postings from the employer's own board (or an institution's own
announcement channel), recent enough to still be early, and not yet carried by
any other board.">
    <input type="checkbox" id="fresh"> <span id="fresh-text">Fresh from the source</span>
  </label>
  <span class="count" id="count"></span>
</section>

<main id="grid" class="grid" aria-live="polite"></main>

<div id="empty" class="empty" hidden>
  <p id="empty-msg">No matches.</p>
</div>

<footer class="foot">
  <span class="muted" id="footer-note"></span>
</footer>

<!-- detail pane -->
<div id="detail" class="overlay" role="dialog" aria-modal="true"
     aria-labelledby="detail-title" hidden>
  <div class="overlay-card detail-card">
    <div class="pane-head">
      <h2 id="detail-title">Posting</h2>
      <div class="pane-tools">
        <button id="detail-open" class="ghost small">Open ad</button>
        <button id="detail-refresh" class="ghost small" title="Re-fetch the full text from the source">Refresh</button>
        <button id="detail-close" class="ghost small" aria-label="Close">✕</button>
      </div>
    </div>
    <div class="pane-body" id="detail-body"></div>
  </div>
</div>

<!-- settings pane -->
<aside id="settings" class="pane wide" hidden aria-labelledby="settings-title">
  <div class="pane-head">
    <h2 id="settings-title">Settings</h2>
    <div class="pane-tools">
      <button id="settings-close" class="ghost small" aria-label="Close">✕</button>
    </div>
  </div>
  <div class="pane-body" id="settings-body"></div>
  <div class="pane-foot">
    <span class="muted" id="settings-note">
      Saved straight to config.yaml. Your comments in that file are kept.
    </span>
  </div>
</aside>

<div id="scrim" class="scrim" hidden></div>

<script src="app.js"></script>
</body>
</html>
