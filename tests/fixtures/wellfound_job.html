<html><head><script type="application/ld+json">{"@context":"http://schema.org/","@type":"JobPosting","title":"Senior Software Engineer - Client Lifecycle","identifier":{"@type":"PropertyValue","name":"Virta Health","value":"4855345"},"employmentType":"FULL_TIME","hiringOrganization":{"@type":"Organization","name":"Virta Health","sameAs":"http://www.virtahealth.com","logo":"https://photos.wellfound.com/startups/i/991802-342b84a862315aebb1ece17ca7a2927a-medium_jpg.jpg?buster=1712968750","location":[{"@type":"Place","address":{"@type":"PostalAddress","addressLocality":"Denver","addressRegion":"Colorado","addressCountry":"United States"},"latitude":39.7392,"longitude":-104.99},{"@type":"Place","address":{"@type":"PostalAddress","addressLocality":"San Francisco","addressRegion":"California","addressCountry":"United States"},"latitude":37.7749,"longitude":-122.419}]},"image":"https://photos.wellfound.com/startups/i/991802-342b84a862315aebb1ece17ca7a2927a-medium_jpg.jpg?buster=1712968750","industry":"Healthcare","directApply":true,"description":"<p>Virta Health is on a mission to reverse metabolic disease in one billion people. Current treatment approaches aren’t working—over half of US adults have either type 2 diabetes or prediabetes, and obesity rates are at an all-time high. Virta is changing this by helping people reverse their metabolic condition through innovations in technology, personalized nutrition, and virtual care delivery reinvented from the ground up. We have raised over $350 million from top-tier investors, and partner with the largest health plans, employers, and government organizations to help their employees and members restore their health and take back their lives. Join us on our mission to reverse metabolic disease in one billion people.</p>\n\n<p>As a Senior Software Engineer on ReCon (Revenue &amp; Contracts), you&#39;ll build the systems that turn care delivered into revenue recognized. ReCon owns Virta&#39;s quote-to-cash path end to end: how customer contracts and pricing are configured, how clinical events become billable episodes of care, how subscriptions and invoices are generated, how claims reach payors, and how we prove all of it reconciles across commercial, billing, and our clinical data. National health plans, PBMs, and large employers depend on the data we produce not just to pay us, but to bill their own clients — so correctness here is a customer-facing product, not back-office plumbing.</p>\n<h3>Responsibilities</h3>\n<ul>\n<li>Lead projects end to end: take an ambiguous problem from a finance, RCM, or client-facing stakeholder, shape it into a design, drive it through review, and own it in production.</li>\n<li>Build and extend the Go services behind Virta&#39;s quote-to-cash path — contract and pricing configuration, billable event generation, subscription and invoice management, and claims submission.</li>\n<li>Make billing correctness provable. Expand the assertion and reconciliation framework that catches discrepancies across Salesforce, Zuora, and our clinical data before they ever reach a customer invoice.</li>\n<li>Improve the reconciliation and billing data our health plan and employer partners depend on — not just to pay us, but to bill their own clients.</li>\n<li>Design self-service tools so finance, RCM, and client operations can configure contracts, correct data, and run bulk changes without an engineer in the loop.</li>\n<li>Apply AI where it earns its place.</li>\n<li>Raise the bar around you through design and code review, and mentor engineers on the team.</li>\n</ul>\n<h3>90 Day Plan</h3>\n<p>Within your first 90 days at Virta, we expect you will do the following:</p>\n\n<ul>\n<li>First 30 days: Production PR merged and deployed; can whiteboard the money path unprompted; has independently found at least one thing that&#39;s wrong.</li>\n<li>60 days: A TDD survived architecture review; Stakeholders start to recognize you and work on building a future-looking feature/project with you.</li>\n<li>90 days: Owns an ambiguous problem and proceeds towards completion with a product mindset; another engineer’s design got better because of your review.</li>\n</ul>\n<h3>Must-Haves</h3>\n<ul>\n<li>5+ years building and operating backend services in production, in Go or another statically typed language</li>\n<li>Experience with event-driven architectures and the failure modes that come with them — eventual consistency, ordering, idempotency, and systems that disagree with each other</li>\n<li>Strong SQL, and comfort working across both application code and the analytics layer</li>\n<li>You&#39;ve owned a system where correctness had consequences outside the company — billing, payments, claims, ledgers, or regulated reporting</li>\n<li>A track record of working directly with non-engineering stakeholders: turning a finance or operations problem into a design, and explaining the tradeoffs back</li>\n<li>Experience with a major cloud platform (we use GCP)</li>\n<li>Working with AI to accelerate development workflows and enhance the SDLC</li>\n<li>Experience in frontend development with React and Typescript.</li>\n</ul>\n<h3>Values-driven culture</h3>\n<p>Virta’s company values drive our culture, so you’ll do well if:</p>\n\n<ul>\n<li>You put <strong><u>people first</u></strong> and take care of yourself, your peers, and our patients equally</li>\n<li>You have a strong sense of <strong><u>ownership</u></strong> and take initiative while empowering others to do the same</li>\n<li>You prioritize positive <strong><u>impact</u></strong> over busy work</li>\n<li>You have <strong><u>no ego</u></strong> and understand that everyone has something to bring to the table regardless of experience</li>\n<li>You appreciate <strong><u>transparency</u></strong> and promote trust and empowerment through open access of information</li>\n<li>You are <strong><u>evidence-based</u></strong> and prioritize data and science over seniority or dogma</li>\n<li>You <strong><u>take risks and rapidly iterate</u></strong></li>\n</ul>\n\n<p>Is this role not quite what you&#39;re looking for? <a href=\"https://jobs.ashbyhq.com/virtahealth/form/talent-community-form\" target=\"_blank\" rel=\"nofollow\"><u>Join our Talent Community</u></a> and <a href=\"https://www.linkedin.com/company/virta-health\" target=\"_blank\" rel=\"nofollow\"><u>follow us on Linkedin</u></a> to stay connected!</p>\n\n<p><em>Virta has a location based compensation structure. Starting pay will be based on a number of factors and commensurate with qualifications &amp; experience. For this role, the compensation range is 161,500 - 232,500. Information about Virta’s benefits is on our Careers page at:</em> <a href=\"https://www.virtahealth.com/careers\" target=\"_blank\" rel=\"nofollow\"><em>https://www.virtahealth.com/careers</em></a><em>.</em></p>\n\n<p><em>As part of your duties at Virta, you may come in contact with sensitive patient information that is governed by HIPAA. Throughout your career at Virta, you will be expected to follow Virta&#39;s security and privacy procedures to ensure our patients&#39; information remains strictly confidential. Security and privacy training will be provided.</em></p>\n\n<p><em>As a remote-first company, our team is spread across various locations with office hubs in Denver and San Francisco.</em></p>\n\n<p><em>Clinical roles: We currently *</em>do not hire** in the following states: AK, HI, RI*</p>\n\n<p><em>Corporate roles: We currently *</em>do not hire** in the following states: AK, DE, HI, ME, MS, OK, SD, VT.*</p>\n\n<p><em>Virta uses Ashby as its applicant tracking system, which incorporates AI-powered tools (provided by OpenAI, AWS, and Google Gemini) in certain aspects of the recruiting process, including application review, candidate screening, and interview note taking; your data is not used to train AI models, and all final hiring decisions are made by Virta Health personnel.</em> <strong>For more information, see Virta’s AI Interview Resources page.</strong> <a href=\"https://www.virtahealth.com/careers/ai-interview-resources\" target=\"_blank\" rel=\"nofollow\"><strong>https://www.virtahealth.com/careers/ai-interview-resources</strong></a></p>\n","datePosted":"2026-10-16T23:31:09Z","jobLocation":[{"@type":"Place","address":{"@type":"PostalAddress","addressLocality":"Seattle","addressRegion":"Washington","addressCountry":"United States"},"latitude":47.6062,"longitude":-122.332}],"jobLocationType":"TELECOMMUTE","applicantLocationRequirements":{"@type":"Country","name":"United States"},"baseSalary":{"@type":"MonetaryAmount","currency":"USD","value":{"@type":"QuantitativeValue","unitText":"YEAR","minValue":162000.0,"maxValue":233000.0}},"jobBenefits":"Nearly free medical, dental, and vision - Virta pays 99% for all employees insurance premiums Flexible PTO - Flexible time off policy to enable a sustainable work/life balance Remote-first company - We focus on delivering the best work experience for remote employees Work Remotely - We provide a remote-first work environment with the ability to work from home Virta for Virtans - Enroll in the Virta treatment for free and give a discount to friends and family Employee Resource Groups - Participate in ﻿﻿Employee Resource Groups like Parents of Virta, Ladies of Virta, and Virtans for DEI Parental Leave - Up to 16 weeks paid parental leave Retirement Benefits - Virta offers 401K and ROTH contribution opportunities Equity - All full-time roles are eligible to receive equity"}</script></head></html>
