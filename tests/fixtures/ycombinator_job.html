  "description": "\u003ch3\u003e\u003cstrong\u003eAbout Type and the Role\u003c/strong\u003e\u003c/h3\u003e\n\u003cp\u003e\u003ca href=\"https://type.ai\"\u003eType\u003c/a\u003e is an AI-native document editor. Our mission is to help people communicate confidently.\u003c/p\u003e\n\u003cp\u003eWe believe that writing is and will always be the backbone of clear thinking and effective communication, especially in the AI era.\u003c/p\u003e\n\u003cp\u003eTools like Type free writers up to do more high-level thinking – exploring more ideas before coming to a conclusion, testing lots of approaches to expressing a message, and arguing with the AI about the oxford comma.\u003c/p\u003e\n\u003cp\u003eWe're backed by Y Combinator and have thousands of customers who love our product.\u003c/p\u003e\n\u003cp\u003eWe're looking for a product-minded software engineer to join our small, formidable team in Brooklyn. Our ideal candidate is high-ownership, low ego, obsessed with their craft, and excited to work at a startup.\u003c/p\u003e\n\u003cp\u003eIf this resonates with you, please apply.\u003c/p\u003e\n\u003ch2\u003e\u003cstrong\u003eWhat you'll do\u003c/strong\u003e\u003c/h2\u003e\n\u003cp\u003eHere's a sample of some things you might work on:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eBuilding advanced rich text editing features\u003c/li\u003e\n\u003cli\u003eWorking on sync and offline first features using data structures such as CRDTs\u003c/li\u003e\n\u003cli\u003eBuilding multiplayer features for collaborative editing\u003c/li\u003e\n\u003cli\u003eBuilding LLM-based writing and editing features that span all levels in the stack\u003c/li\u003e\n\u003cli\u003ePrototyping experimental AI writing and editing workflows\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e\u003cstrong\u003eWhat we're looking for in you\u003c/strong\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e4+ years of software engineering with focus on complex web applications\u003c/li\u003e\n\u003cli\u003eProven experience building interaction-heavy applications like editors\u003c/li\u003e\n\u003cli\u003eStrong product intuition for identifying friction points and solving real user problems\u003c/li\u003e\n\u003cli\u003eObsessive attention to detail and appreciation for the subtle UX elements that make editors feel natural\u003c/li\u003e\n\u003cli\u003eAbility to contribute to product strategy, not just implementation\u003c/li\u003e\n\u003cli\u003eA belief that customer problems come first in all product decisions\u003c/li\u003e\n\u003cli\u003eStrong foundational skills in Computer Science\u003c/li\u003e\n\u003cli\u003eA track record of shipping complex products with excellent user experiences\u003c/li\u003e\n\u003cli\u003eLow ego, high ownership\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e\u003cstrong\u003eTechnical Skills\u003c/strong\u003e\u003c/h2\u003e\n\u003cp\u003eWe value curiosity and adaptability in our engineers. Your specific technical background should include:\u003c/p\u003e\n\u003ch3\u003e\u003cstrong\u003eMust Have:\u003c/strong\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\n\u003cstrong\u003eStrong JavaScript expertise\u003c/strong\u003e — Deep experience with React and TypeScript for complex applications\u003c/li\u003e\n\u003cli\u003e\n\u003cstrong\u003eFull-stack capabilities\u003c/strong\u003e — Ability to design scalable systems and build production-ready services\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e\u003cstrong\u003eNice to Have:\u003c/strong\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\n\u003cstrong\u003eRich text editing\u003c/strong\u003e — Familiarity with frameworks like Slate.js or ProseMirror\u003c/li\u003e\n\u003cli\u003e\n\u003cstrong\u003eCollaborative editing\u003c/strong\u003e — Experience with CRDTs or similar real-time synchronization technologies\u003c/li\u003e\n\u003cli\u003e\n\u003cstrong\u003eOffline-first design\u003c/strong\u003e — Knowledge of IndexedDB, service workers, and efficient sync protocols\u003c/li\u003e\n\u003cli\u003e\n\u003cstrong\u003eLarge language models\u003c/strong\u003e — Experience building production applications with LLMs\u003c/li\u003e\n\u003cli\u003e\n\u003cstrong\u003eBackend technologies\u003c/strong\u003e — Experience with Node.js/Express and MongoDB\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e\u003cstrong\u003eBenefits\u003c/strong\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eCompetitive salary\u003c/li\u003e\n\u003cli\u003eGenerous stock package\u003c/li\u003e\n\u003cli\u003e100% employer-covered medical, dental, and vision for you and any dependents\u003c/li\u003e\n\u003cli\u003eDedicated workspace at our HQ in Williamsburg, Brooklyn\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eWe actively encourage people of all backgrounds – particularly those from underrepresented groups – to apply. We believe a diverse set of perspectives and lived experiences strengthen our team and product, and we're committed to building an inclusive work environment.\u003c/p\u003e\n",
