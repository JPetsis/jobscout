[project]
name = "jobscout"
version = "0.1.0"
description = "Local-first job search for DACH + remote roles. No API keys, no accounts, no metered calls."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.3",
    "certifi>=2024.2.2",
    "geonamescache>=3.0.2",
]

[project.scripts]
jobscout = "jobscout.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobscout"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
