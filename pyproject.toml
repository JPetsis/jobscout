[project]
name = "jobscout"
version = "0.2.9"
description = "Local-first job search for DACH + remote roles. No API keys, no accounts, no metered calls."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.3",
    "certifi>=2024.2.2",
    "geonamescache>=3.0.2",
]

[project.optional-dependencies]
# The desktop UI. Linux gets NO pywebview backend by default, so it must name
# one explicitly or the app is a silent no-op there -- Qt (PySide6) ships
# manylinux wheels; GTK's PyGObject is sdist-only and needs system headers.
app = [
    "pywebview>=6.2",
    "pywebview[qt]>=6.2; sys_platform == 'linux'",
]

[project.scripts]
jobscout = "jobscout.cli:main"
jobscout-app = "jobscout.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobscout"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
